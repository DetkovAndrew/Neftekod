# Кандидатный набор управляющих воздействий.
# Единственное место, где перечислен список — агенты читают отсюда,
# список не должен дублироваться в коде (см. ARCHITECTURE.md §4).
#
# confidence:
#   confirmed_from_pid — тег визуально подтверждён как регулятор с уставкой
#                         (FC/TC/PC/LC/PIC) на одном из 4 сканов P&ID АВТ.
#   assumption          — P&ID для установки не выдан (24-2000) либо
#                         сопоставление "модельная переменная -> реальный тег"
#                         сделано по эталонной схеме без независимого
#                         подтверждения; требует инженерной проверки.
# bounds: null           — границы ещё не определены количественно (будут
#                         взяты как 5-95 перцентиль истории при построении
#                         онтологии, см. scripts/build_tag_ontology.py)

installations:
  avt:
    variables:
      - name: avt_furnace_outlet_temp_c
        tag: "T55"
        unit: "°C"
        description: "Температура на выходе из печи П-3 (FIRC2470)"
        confidence: confirmed_from_pid
        rationale: >
          Эталонная схема (Ustanovka_AVT_merged.pdf) помечает эту переменную
          литерой 'У' (управляемый параметр) для стадии АВТ. P&ID-скан
          подтверждает регулятор TC на T55.
        bounds: null

      - name: avt_column_top_pressure_mpa
        tag: "P22"
        unit: "МПа"
        description: "Давление верха колонны К-2 (PIC)"
        confidence: assumption
        rationale: >
          Эталонная схема называет обобщённую переменную
          'avt_column_pressure_mpa_abs' без привязки к конкретному тегу.
          P22 выбран как наиболее вероятное соответствие (подтверждённый
          PIC-регулятор на главной атмосферной колонне К-2, определяющей
          состав дизельной фракции). Требует подтверждения технологами.
        bounds: null

      - name: avt_diesel_cut_flow_290_350
        tag: "F30"
        unit: "т/ч"
        description: "Расход фр. 290-350°C с установки -- отбор, формирующий границу дизельной фракции"
        confidence: confirmed_from_pid
        rationale: >
          Подтверждён как FC-регулятор на скане P&ID doc00628420260914104535
          И одновременно является прямым входом формул AVT6:240-350:D15/CFPP
          (через F65/(F32+F30)) и AVT6:240-350:T50/EBP -- эффект на прогноз
          качества можно посчитать количественно уже сегодня, не только
          направленно. ПРИМЕЧАНИЕ: единственный тег с полем `tag` (не
          `tags`) попадает в активный набор Агента оптимизации v1
          (см. optimization_agent._flatten_active_variables) -- было
          обнаружено и исправлено разделение с F32 из общего списка `tags`.
        bounds: null

      - name: avt_diesel_cut_flow_240_290
        tag: "F32"
        unit: "т/ч"
        description: "Расход фр. 240-290°C с установки -- отбор, формирующий границу дизельной фракции"
        confidence: confirmed_from_pid
        rationale: >
          Тот же статус, что у avt_diesel_cut_flow_290_350 (см. выше):
          подтверждённый FC-регулятор и прямой вход тех же ВАК-формул.
        bounds: null

      - name: avt_stripper_steam_flows
        tags: ["F25", "F26", "F27", "F28"]
        unit: "т/ч"
        description: "Расход бензина после Т-26 (F25) и пара в отпарные колонны К-6/К-7/К-9 (F26-F28)"
        confidence: confirmed_from_pid
        rationale: >
          Подтверждены как FC-регуляторы на P&ID, но НЕ являются прямыми
          входами ни одной из 17 переданных ВАК-формул -- их количественный
          эффект на нормируемые показатели ДТ сегодня оценить нечем.
          Оставлены в реестре как честно определённые, но НЕ включены в
          активный набор кандидатов Агента оптимизации v1 (см.
          ARCHITECTURE.md §13) -- добавление требует либо ВАК-формулы,
          которой нет в материалах, либо будущей ML-модели.
        bounds: null
        active_in_optimizer_v1: false

  hydrotreating_242000:
    variables:
      - name: ht_feed_flow_m3h
        tag: "F15"
        unit: "м³/ч"
        description: "Расход сырья на установку (объёмный)"
        confidence: assumption
        rationale: >
          Эталонная схема помечает 'У'. P&ID для 24-2000 не выдан
          (подтверждено на Q&A: "242000 никак не относится к схеме АВТ").
        bounds: null

      - name: ht_gas_oil_ratio_m3m3
        tags: {gas: "F25", oil: "F15"}
        unit: "м³/м³"
        description: "Соотношение расхода свежего ВСГ к расходу сырья"
        confidence: assumption
        rationale: "Эталонная схема, переменная 'У' явно названа ht_gas_oil_ratio_m3m3."
        bounds: null

      - name: ht_inlet_temp_c
        tag: "T5"
        unit: "°C"
        description: "Температура ГСС на выходе Р-201 / входе в Р-202"
        confidence: assumption
        rationale: >
          Эталонная схема, переменная 'У'. Q&A-сессия: эксперт подтвердил
          прямую рычаговую связь "температура реактора гидроочистки -> сера"
          (количественная оценка не расшифрована в транскрипте дословно,
          ответ эксперта неразборчив — требует уточнения).
        bounds: null

      - name: ht_pressure_mpa
        tag: "P13"
        unit: "МПа"
        description: "Давление на входе Р-202"
        confidence: assumption
        rationale: "Эталонная схема, переменная 'У'."
        bounds: null

  blending:
    variables:
      # --- РАБОЧИЙ контур блендинга (ARCHITECTURE.md §6.6) -------------
      # Доли компонентов ДИЗЕЛЬНОГО ПУЛА АВТ. В отличие от товарного
      # блендинга ниже, здесь есть и исторические расходы компонентов
      # (F30/F32), и качество каждого компонента (отдельные точки
      # отбора ЛИМС), и проверенная на истории модель смешения
      # (config/blend_model.yaml). Кандидаты генерирует Агент блендинга
      # ПАРОЙ действий при неизменном суммарном расходе, поэтому
      # Σ долей = 100% выполняется по построению и независимо
      # перепроверяется Guard'ом (проверка blend_sum_100).
      - name: blend_share_avt_fr_290_350
        tag: "F30"
        unit: "т/ч"
        description: "Доля тяжёлого компонента пула (фр. 290-350 °C) в дизельной фракции АВТ"
        confidence: confirmed_from_pid
        active_in_optimizer_v1: false   # генерируется Агентом блендинга, не сеткой по одному тегу
        rationale: >
          Тот же FC-регулятор, что avt_diesel_cut_flow_290_350, но
          используется как ДОЛЯ в паре с F32. Состав пула подтверждён
          данными (показатели точки отбора '3' лежат строго между
          точками '2' и '2.1') и производственной ВАК-формулой
          AVT6:240-350:D15, которая содержит ровно F30/(F32+F30).
          Влияние доли на T95 и T90 смеси проверено вне выборки
          forward-chaining бэктестом, коэффициент переноса на продукт
          измерен регрессией по 1223 парам проб ЛИМС.
        bounds: null

      - name: blend_share_avt_fr_240_290
        tag: "F32"
        unit: "т/ч"
        description: "Доля лёгкого компонента пула (фр. 240-290 °C) в дизельной фракции АВТ"
        confidence: confirmed_from_pid
        active_in_optimizer_v1: false   # см. выше -- меняется только в паре
        rationale: "Парный компонент к blend_share_avt_fr_290_350."
        bounds: null

      # --- ТОВАРНЫЙ блендинг: данных нет, остаётся на уровне схемы ----
      - name: blend_component_share_pct
        tags: null
        unit: "%"
        description: "Доли компонентов товарного ДТ (Σ = 100%)"
        confidence: design_level
        rationale: >
          В выданных avt_tags.csv/242000_tags.csv нет исторических тегов
          блендинга — переменная присутствует только в эталонной схеме
          как модельная конструкция. Оптимизация по ней возможна только
          на уровне правил/ограничений, без исторической валидации,
          до появления соответствующих данных.
        bounds: [0, 100]

      - name: additive_dose_kg_t
        tags: null
        unit: "кг/т"
        description: "Дозировка присадок A/B"
        confidence: design_level
        rationale: "См. blend_component_share_pct — тот же статус данных."
        bounds: null
