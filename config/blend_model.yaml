_meta:
  methodology: Blend model for the AVT diesel pool. Mixing rules are physics/literature
    (volumetric for density, mass for sulfur, volumetric distillation-curve blending,
    power blending index for low-temperature properties). Only a single bias constant
    per property is fitted, estimated on PAST blocks only (forward chaining, 4 blocks).
    Component identity established from data, and independently confirmed by the plant's
    own VAK formula AVT6:240-350:D15, which contains F30/(F32+F30).
  blend_target: Установка 'АВТ'. Точка отбора '3'. Продукт 'Дизельное топливо'
  cross_check_point: Установка 'Гидроочистка'. Точка отбора '1'. Продукт 'ФРАКЦ_ДИЗ'.
  lims_tolerance: 0 days 06:00:00
  flow_window: 0 days 02:00:00
  cloud_point_index_exponent: 0.05
