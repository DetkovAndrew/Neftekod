_meta:
  purpose: >
    Экономические критерии в РЕАЛЬНЫХ единицах (тонны, Гкал, кВт·ч, нм3, рубли)
    вместо безразмерного прокси -- ARCHITECTURE.md §6.7.
  important: >
    ВСЕ цены ниже -- ДОПУЩЕНИЯ. В выданных материалах хакатона нет ни одной
    экономической величины: ни цен, ни тарифов, ни себестоимости. Поэтому
    цены вынесены в один файл, помечены источником и пересчитываются правкой
    YAML без единой строчки кода. Физические величины (тонны, Гкал, кВт·ч)
    считаются ИЗ ТЕЛЕМЕТРИИ и от цен не зависят -- если экономист завода
    заменит цены, физика останется прежней. Карточка оператора всегда
    показывает и физические величины, и рубли, чтобы было видно, что
    именно является допущением.
  policy: >
    Экономика НИКОГДА не может перевесить качество или жёсткое ограничение
    (ключевой принцип ТЗ, ARCHITECTURE.md §0). Она участвует только в
    ранжировании уже допустимых вариантов.

prices:
  diesel_rub_per_t:
    value: 60000
    is_assumption: true
    source: "Порядок цен оптового рынка ДТ Евро-5 (биржевые котировки), 2026. Заменить на цену завода."
  fuel_gas_rub_per_gcal:
    value: 1250
    is_assumption: true
    source: >
      Природный/топливный газ ~9000 руб/1000 нм3 при низшей теплоте сгорания
      ~8 Гкал/1000 нм3 и КПД печи 0.9 -> ~1250 руб/Гкал полезного тепла.
  electricity_rub_per_kwh:
    value: 6.5
    is_assumption: true
    source: "Порядок промышленного тарифа на электроэнергию, 2026."
  hydrogen_rub_per_nm3:
    value: 20.0
    is_assumption: true
    source: "Водородсодержащий газ с КЦА; порядок себестоимости товарного H2 ~200-250 руб/кг."

physical_constants:
  furnace_efficiency:
    value: 0.9
    is_assumption: true
    source: "Типовой КПД трубчатой печи; паспортных данных не выдано."
  compressor_polytropic_efficiency:
    value: 0.75
    is_assumption: true
    source: "Типовой политропный КПД центробежного компрессора."
  recycle_gas_k_ratio:
    value: 1.38
    is_assumption: true
    source: "Показатель адиабаты водородсодержащего газа (преимущественно H2)."
  compressor_suction_temp_c:
    value: 40.0
    is_assumption: true
    source: "Типовая температура на приёме ЦК после холодильника; тега нет."

# Потоки, из которых считаются физические величины. Всё -- реальные теги
# КИП из справочника (теги АВТ_24-2000.xlsx), а не выдуманные.
streams:
  product_diesel:
    description: "Гидроочищенное ДТ в цех №8 -- товарный выпуск установки"
    mass_flow_tag: "242000:F17"
    unit: "т/ч"
  ht_feed:
    description: "Сырьё гидроочистки"
    mass_flow_tag: "242000:F9"
    unit: "т/ч"
    typical_density_kg_m3: 845.0
    typical_mean_boiling_point_c: 280.0
  ht_makeup_hydrogen:
    description: "Свежий ВСГ с КЦА на установку"
    flow_tag: "242000:F25"
    unit: "нм3/ч"
  ht_recycle_gas:
    description: "Циркулирующий газ от ЦК-201"
    flow_tag: "242000:F2"
    unit: "нм3/ч"
    suction_pressure_tag: "242000:P3"
    discharge_pressure_tag: "242000:P13"
  avt_vacuum_furnace_p3:
    description: "Печь П-3 АВТ: нагрев мазута перед К-10"
    mass_flow_tag: "avt:F31"
    inlet_temp_tag: "avt:T33"
    outlet_temp_tag: "avt:T55"
    typical_density_kg_m3: 930.0
    typical_mean_boiling_point_c: 450.0
    density_note: >
      Плотность и средняя температура кипения мазута в ЛИМС не измеряются --
      взяты типовые значения для мазута прямой перегонки. Влияют только на
      теплоёмкость (Kesler-Lee), то есть на абсолютную величину Гкал;
      ПРИРАЩЕНИЕ при изменении уставки печи от них почти не зависит.
    is_assumption: true
