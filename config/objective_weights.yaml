# Веса взвешенной целевой функции Агента оптимизации (ТЗ п.4: "Допускается
# взвешенная целевая функция, ранжирование вариантов или Парето-подход").
#
# ВАЖНО: эти веса влияют только на РАНЖИРОВАНИЕ уже допустимых вариантов.
# Ни один вес здесь не может "перевесить" жёсткое ограничение -- кандидаты,
# нарушающие §7 (hard_constraints.yaml) или hard_stop Агента надёжности,
# отбрасываются ДО ранжирования, а не штрафуются весом (см. ARCHITECTURE.md §0).
#
# Значения ниже -- начальная, явно произвольная калибровка (сумма весов
# качества/риска намеренно больше веса пропускной способности/энергии,
# отражая "Ключевой принцип" ТЗ), подлежит пересмотру по мере появления
# реальных экономических данных.

quality_margin_improvement: 1.0   # рост запаса до жёсткого предела -- поощряется
equipment_risk_severity: 1.5      # рост индекса тяжести режима -- штрафуется сильнее качества
throughput_proxy: 0.3             # рост пропускной способности -- поощряется слабо
energy_cost_proxy: 0.3            # рост энерго/стоимостного прокси -- штрафуется слабо

is_assumption: true
source: "Не откалибровано по реальным экономическим данным -- в материалах хакатона их нет."
