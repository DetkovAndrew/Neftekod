# Жёсткие ограничения — нарушение любого из них исключает вариант из рассмотрения
# независимо от выигрыша по другим критериям (см. ARCHITECTURE.md §0, §7).
#
# is_assumption: true  — значение не подтверждено официальной спецификацией/ответом
#                         эксперта на Q&A, взято из эталонной схемы организаторов
#                         (Ustanovka_AVT_merged.pdf) или консервативной практики.
#                         Подлежит замене одной строкой, как только появится
#                         официальная спецификация.

# risk_margin_high/risk_margin_medium — АБСОЛЮТНЫЕ (в единицах самой
# метрики) пороги классификации риска по запасу до предела (margin).
# Раньше использовался единый относительный порог (10%/25% от limit) —
# для T95 (лимит 360°C) это давало нереалистично широкую зону "high risk"
# (margin=20°C уже HIGH, хотя реальные T95 варьируются в диапазоне
# 330-360°C и запас 20°C комфортен). Пороги ниже — явное допущение
# (нет исторических данных по частоте/распределению инцидентов), но хотя
# бы откалиброваны по порядку реальной изменчивости показателя, а не
# единым процентом для всех единиц измерения сразу.
# watch_at / act_at -- ПОРОГИ ОПОВЕЩЕНИЯ в единицах самого показателя,
# задаются технологом (политика "лучше перебдеть": выставлены с запасом).
#   значение за watch_at -> "близко к пределу, под наблюдением" (без действия)
#   значение за act_at   -> "вплотную к пределу", система ищет управляющее действие
#   за limit             -> "за пределом"
# reference_error -- типичная ошибка оценки (MAE), под которую пороги заданы
# (soft-sensor / последний ЛИМС, config/soft_sensor_selection.yaml). Если
# оценка менее точна (формула, устаревший источник), оба порога сдвигаются к
# норме на разницу ошибок: чем хуже данные, тем раньше реакция. Свежий ЛИМС
# (ошибка не задана) -- без сдвига.
# risk_margin_* ниже используются только для понижения confidence оценки
# (ошибка метода сопоставима с допуском), не для классификации риска.
product_diesel:
  sulfur_mg_kg:
    op: "<="
    limit: 10.0
    watch_at: 7.5
    act_at: 8.5
    reference_error: 1.18
    risk_margin_high: 1.0
    risk_margin_medium: 2.5
    is_assumption: false
    source: "ТЗ_нефтекод.docx п.4 (буквально); подтверждено Ustanovka_AVT_merged.pdf стр.4"

  t95_c:
    op: "<="
    limit: 360.0
    watch_at: 350.0
    act_at: 354.0
    reference_error: 4.5
    risk_margin_high: 5.0
    risk_margin_medium: 15.0
    is_assumption: true
    source: "Ustanovka_AVT_merged.pdf стр.4, 'Контроль качества'. ГОСТ/EN явно не назван на Q&A."

  cetane_number:
    op: ">="
    limit: 51.0
    watch_at: 53.0
    act_at: 52.0
    reference_error: 1.23
    risk_margin_high: 1.0
    risk_margin_medium: 2.0
    is_assumption: true
    source: "Ustanovka_AVT_merged.pdf стр.4, 'Контроль качества'. ГОСТ/EN явно не назван на Q&A."

  cfpp_c:
    op: "<="
    limit: null   # климатический класс не выдан — требует явного выбора сценария перед демонстрацией
    risk_margin_high: 3.0
    risk_margin_medium: 8.0
    is_assumption: true
    source: "Не определено в материалах — сезонный/климатический класс ДТ не зафиксирован."

blending:
  component_share_sum_pct:
    op: "=="
    limit: 100.0
    tolerance_pct: 0.5
    is_assumption: false
    source: "ТЗ_нефтекод.docx п.4, буквально"

# Проверка совместной валидированной области управляющих переменных
# (не только маржинальные бонды, но и совместные комбинации —
# см. ARCHITECTURE.md §5.3, по методике Ta & Liu 2027 §3.3.3)
operating_envelope:
  percentile_low: 5
  percentile_high: 95
  check_joint_envelope: true
  source: "Ta & Liu (2027), Fuel 429:140956, §3.3.1, §3.3.3"
