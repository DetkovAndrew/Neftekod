_meta:
  purpose: Интервенционная оценка d(ln S)/dT по поточному анализатору Q21 этой установки
  method: 'Step-response on the plant''s own history: temperature steps in steady
    reactor regime, sulfur response read from the online analyser Q21 after a fixed
    lag. Relative (log) change is used because HDS kinetics are multiplicative.'
  closed_loop_warning: Плант работает в замкнутом контуре (подтверждено на Q&A). Температуру
    поднимают, когда сера растёт, поэтому наивная оценка смещена К НУЛЮ. Корреляция
    уровня серы до ступени с величиной ступени измерена и приведена ниже как доказательство.
  temperature_tag: 242000:T5
  sulfur_tag: 242000:Q21
  analyzer_range_mg_kg:
  - 0.2
  - 24.5
  response_lag: 0 days 04:00:00
  pre_window: 0 days 06:00:00
  post_window: 0 days 06:00:00
  min_step_c: 0.8
feedback_evidence:
  corr_sulfur_before_vs_step_size: 0.2534
  interpretation: Положительная корреляция означает, что температуру поднимают именно
    при высокой сере -- регулирование с обратной связью подтверждено данными, и оценки
    ниже занижают истинный эффект.
