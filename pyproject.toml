[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neftekod-mas"
version = "0.1.0"
description = "МАС поддержки решений АВТ -> Гидроочистка -> Блендинг (хакатон Нефтекод)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:The argument 'eval_set' is deprecated"]
